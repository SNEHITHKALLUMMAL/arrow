name: arrow_puzzle
description: A relaxing logic puzzle game - clear the board by tapping arrows in the correct order.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0
  shared_preferences: ^2.2.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  just_audio: ^0.9.36
  path_provider: ^2.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.0
  equatable: ^2.0.5
  uuid: ^4.2.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.3.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/levels/
    - assets/
